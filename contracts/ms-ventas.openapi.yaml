openapi: 3.0.3
info:
  title: Jersey Club — ms-ventas
  version: 1.1.0
  description: |
    Ventas con cierre en un solo clic, detalle con costo congelado y ganancia real.

    `POST /ventas` orquesta la saga (ver `docs/04_Patrones_Integracion_Obsidian.md`):
    1. **Idempotencia:** si la `Idempotency-Key` ya existe devuelve la venta original (`200`) o el
       resultado previo (`409 VENTA_RECHAZADA` / `VENTA_FALLIDA` / `VENTA_EN_PROCESO`).
    2. **Cliente:** `GET ms-clientes /clientes/{id}` (timeout 2 s). Sin `cliente_id` → consumidor final.
       Si ms-clientes no responde, la venta NO se bloquea: usa `cliente_respaldo` o un snapshot
       `NO_VERIFICADO`, y `message` incluye una advertencia. Un `404` de ms-clientes sí es error.
    3. Guarda la venta como `PENDIENTE` (comprobante `JC-AAAA-NNNNNN`).
    4. `POST ms-inventario /stock/descuentos` (timeout 3 s, `Idempotency-Key` = id de la venta).
       `409`/`404`/`400` → venta `RECHAZADA` y se propaga el error de inventario.
       Inventario caído o timeout → compensación preventiva y `503 INVENTARIO_NO_DISPONIBLE`.
    5. En una transacción local: `detalle_ventas` con `valor_jersey_club_unitario` congelado, totales,
       evento `VentaConfirmada` en `outbox_eventos` y estado `CONFIRMADA`.
    6. **Compensación:** si el paso 5 falla, `POST /stock/reversiones` y estado `FALLIDA`
       (`500 VENTA_FALLIDA`). Si la reversión tampoco es posible, la venta queda `PENDIENTE`
       con observación `REVERSION_PENDIENTE` para conciliación.

    Reintentos hacia otros servicios: máximo 2, con backoff (150 ms, 300 ms), solo ante conexión
    rechazada/reiniciada o 502/503/504; los timeouts no se reintentan. Todas las llamadas propagan `X-Correlation-Id`.
    Los montos se calculan en centavos enteros; se envían y responden como texto con 2 decimales.
    Las fechas de filtros son fechas locales de Ecuador (`America/Guayaquil`).

    Changelog 1.1.0: `GET /ventas/dashboard` reemplaza a `GET /reportes/ganancias` (aún no publicado);
    códigos de repetición idempotente; `500 VENTA_FALLIDA`.
servers:
  - url: http://localhost:3012/api/v1
    description: Local directo
  - url: http://localhost:3010/api/v1
    description: Local vía gateway (requiere JWT)
tags:
  - name: ventas
  - name: salud
paths:
  /ventas:
    post:
      tags: [ventas]
      summary: Cerrar una venta en un solo clic
      operationId: crearVenta
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearVenta' }
            example:
              cliente_id: 00000000-0000-4000-8000-000000000001
              metodo_pago: TRANSFERENCIA
              vendedor_id: null
              items:
                - variante_id: 3f2c9a1e-8b7d-4c6a-9e5f-1a2b3c4d5e6f
                  cantidad: 1
                  precio_venta_unitario: '45.00'
      responses:
        '201':
          description: Venta confirmada; stock descontado
          headers:
            Location: { schema: { type: string }, description: '/api/v1/ventas/{id}' }
            X-Correlation-Id: { schema: { type: string, format: uuid } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Venta' }
        '200':
          description: Repetición idempotente; devuelve la venta original sin volver a descontar
          headers:
            Idempotent-Replayed: { schema: { type: boolean, example: true } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Venta' }
        '400':
          description: '`VALIDACION_FALLIDA`, `IDEMPOTENCY_KEY_REQUERIDA` o `IDEMPOTENCY_KEY_INVALIDA`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`CLIENTE_NO_ENCONTRADO` o `VARIANTE_NO_ENCONTRADA`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            `STOCK_INSUFICIENTE` o `VARIANTE_INACTIVA` (la venta queda `RECHAZADA` y no se movió stock),
            o repetición de una clave cuya venta terminó `VENTA_RECHAZADA` / `VENTA_FALLIDA` / está `VENTA_EN_PROCESO`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                status: 409
                error: Conflict
                details: ['Variante 3f2c9a1e-... (LTOO2): solicitado 2, disponible 1']
                error_code: STOCK_INSUFICIENTE
                correlation_id: 7b0d2c1e-4f7a-4d3e-9b1a-2f6c8e9d0a11
        '500':
          description: '`VENTA_FALLIDA`: error al confirmar después de descontar; el stock fue revertido (compensación)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: '`INVENTARIO_NO_DISPONIBLE`; no se registra la venta'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [ventas]
      summary: Historial de ventas
      operationId: listarVentas
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: desde, in: query, schema: { type: string, format: date }, description: Fecha local inclusive }
        - { name: hasta, in: query, schema: { type: string, format: date }, description: Fecha local inclusive }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoVenta' } }
        - { name: metodo_pago, in: query, schema: { $ref: '#/components/schemas/MetodoPago' } }
        - { name: cliente_id, in: query, schema: { type: string, format: uuid } }
        - { name: vendedor_id, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Página de ventas, más recientes primero (sin detalle)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/VentaResumen' }
                          meta: { $ref: '#/components/schemas/MetaPaginacion' }
        '400':
          description: '`VALIDACION_FALLIDA` (incluye `desde` posterior a `hasta`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /ventas/dashboard:
    get:
      tags: [ventas]
      summary: KPIs del dashboard ejecutivo
      description: Solo considera ventas `CONFIRMADA`. Por defecto, del primer día del mes en curso a hoy (hora de Ecuador).
      operationId: obtenerDashboard
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: KPIs del periodo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Dashboard' }
        '400':
          description: '`VALIDACION_FALLIDA`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /ventas/{id}:
    get:
      tags: [ventas]
      summary: Obtener venta con detalle
      operationId: obtenerVenta
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Venta encontrada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Venta' }
        '404':
          description: '`VENTA_NO_ENCONTRADA`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /salud:
    get:
      tags: [salud]
      summary: Estado del servicio y del esquema conectado
      operationId: salud
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaBase' }
        '503':
          description: '`BASE_DATOS_NO_DISPONIBLE`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Generada por el frontend, una por intento de cierre de venta.
      schema: { type: string, minLength: 8, maxLength: 100, pattern: '^[\w\-:.]+$' }
  schemas:
    RespuestaBase:
      type: object
      required: [status, message, data]
      properties:
        status: { type: integer, example: 201 }
        message: { type: string, example: Venta confirmada }
        data: {}
    Error:
      type: object
      required: [status, error, details, error_code, correlation_id]
      properties:
        status: { type: integer }
        error: { type: string }
        details:
          type: array
          items: { type: string }
        error_code: { type: string }
        correlation_id: { type: string, format: uuid }
    MetaPaginacion:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    Dinero:
      type: string
      pattern: '^-?\d{1,8}\.\d{2}$'
      example: '45.00'
    MetodoPago:
      type: string
      enum: [TRANSFERENCIA, EFECTIVO, TARJETA]
    EstadoVenta:
      type: string
      enum: [PENDIENTE, CONFIRMADA, RECHAZADA, FALLIDA]
    ClienteRespaldo:
      type: object
      additionalProperties: false
      description: Datos mínimos del cliente para vender si ms-clientes no está disponible (degradación).
      required: [tipo_identificacion, identificacion, nombre_completo]
      properties:
        tipo_identificacion: { type: string, enum: [CEDULA, RUC, PASAPORTE, CONSUMIDOR_FINAL] }
        identificacion: { type: string, maxLength: 20 }
        nombre_completo: { type: string, maxLength: 150 }
        telefono: { type: string, maxLength: 25 }
        email: { type: string, format: email }
        ciudad: { type: string, maxLength: 80 }
        direccion_referencia: { type: string, maxLength: 500 }
    CrearVenta:
      type: object
      additionalProperties: false
      required: [metodo_pago, items]
      properties:
        cliente_id:
          type: string
          format: uuid
          description: Si se omite, la venta es a consumidor final (con `cliente_respaldo` como snapshot si se envía).
        cliente_respaldo: { $ref: '#/components/schemas/ClienteRespaldo' }
        vendedor_id:
          type: string
          format: uuid
          nullable: true
          description: Reservado para comisiones en ms-rrhh. Sin validación cruzada en el MVP.
        metodo_pago: { $ref: '#/components/schemas/MetodoPago' }
        observacion: { type: string, maxLength: 500 }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [variante_id, cantidad, precio_venta_unitario]
            properties:
              variante_id: { type: string, format: uuid }
              cantidad: { type: integer, minimum: 1, maximum: 1000 }
              precio_venta_unitario:
                description: Texto ('45.00') o número (45)
                oneOf:
                  - { type: string, pattern: '^\d{1,8}(\.\d{1,2})?$' }
                  - { type: number, minimum: 0 }
    DetalleVenta:
      type: object
      properties:
        id: { type: string, format: uuid }
        variante_id: { type: string, format: uuid }
        snapshot_producto:
          type: object
          description: Snapshot devuelto por ms-inventario en el descuento (`SnapshotVariante`).
          additionalProperties: true
        cantidad: { type: integer }
        precio_venta_unitario: { $ref: '#/components/schemas/Dinero' }
        valor_jersey_club_unitario: { $ref: '#/components/schemas/Dinero' }
        subtotal: { $ref: '#/components/schemas/Dinero' }
        ganancia_linea: { $ref: '#/components/schemas/Dinero' }
    VentaResumen:
      type: object
      properties:
        id: { type: string, format: uuid }
        numero_comprobante: { type: string, example: JC-2026-000001 }
        cliente_id: { type: string, format: uuid }
        cliente_snapshot:
          type: object
          additionalProperties: true
          description: 'Incluye `origen`: `MS_CLIENTES`, `CONSUMIDOR_FINAL`, `RESPALDO_PAYLOAD` o `NO_VERIFICADO`.'
        vendedor_id: { type: string, format: uuid, nullable: true }
        metodo_pago: { $ref: '#/components/schemas/MetodoPago' }
        estado: { $ref: '#/components/schemas/EstadoVenta' }
        total_vendido: { $ref: '#/components/schemas/Dinero' }
        costo_total_jrs: { $ref: '#/components/schemas/Dinero' }
        ganancia_total: { $ref: '#/components/schemas/Dinero' }
        observacion: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Venta:
      allOf:
        - $ref: '#/components/schemas/VentaResumen'
        - type: object
          properties:
            detalle:
              type: array
              items: { $ref: '#/components/schemas/DetalleVenta' }
    Dashboard:
      type: object
      properties:
        periodo:
          type: object
          properties:
            desde: { type: string, format: date }
            hasta: { type: string, format: date }
            zona_horaria: { type: string, example: America/Guayaquil }
        ventas_confirmadas: { type: integer, example: 2 }
        unidades_vendidas: { type: integer, example: 2 }
        total_vendido: { $ref: '#/components/schemas/Dinero' }
        costo_total_jrs: { $ref: '#/components/schemas/Dinero' }
        ganancia_neta: { $ref: '#/components/schemas/Dinero' }
        margen_porcentaje: { type: string, example: '33.33' }
        ticket_promedio: { $ref: '#/components/schemas/Dinero' }
        por_metodo_pago:
          type: array
          description: Siempre los 3 métodos, ordenados por total vendido.
          items:
            type: object
            properties:
              metodo_pago: { $ref: '#/components/schemas/MetodoPago' }
              ventas: { type: integer }
              total_vendido: { $ref: '#/components/schemas/Dinero' }
              ganancia_total: { $ref: '#/components/schemas/Dinero' }
        top_productos:
          type: array
          maxItems: 5
          description: Agrupado por producto del snapshot, ordenado por unidades y luego por total.
          items:
            type: object
            properties:
              producto_id: { type: string, format: uuid }
              nombre: { type: string }
              marca_equipo: { type: string }
              temporada_coleccion: { type: string, nullable: true }
              unidades: { type: integer }
              total_vendido: { $ref: '#/components/schemas/Dinero' }
              ganancia_total: { $ref: '#/components/schemas/Dinero' }
