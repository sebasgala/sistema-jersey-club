openapi: 3.0.3
info:
  title: Jersey Club — ms-inventario
  version: 1.1.0
  description: |
    Catálogo generalizado (`productos`, `variantes`), stock en tiempo real y Kardex (`movimientos_stock`).

    Reglas del contrato (ver `CLAUDE.md`):
    - Toda respuesta exitosa usa el sobre `{ status, message, data }`.
    - Todo error usa `{ status, error, details[], error_code, correlation_id }`.
    - `X-Correlation-Id` se acepta en toda petición y se devuelve en toda respuesta.
    - Descuentos, reversiones y ajustes exigen `Idempotency-Key` (8–48 caracteres `[A-Za-z0-9_-:.]`,
      en la cabecera o en el campo `idempotency_key` del cuerpo; la cabecera tiene prioridad).
      Repetir la misma clave devuelve el resultado original (`200` + `Idempotent-Replayed: true`)
      sin volver a mover stock. Reusar una clave con otro contenido → `409 IDEMPOTENCY_KEY_CONFLICTO`.
    - Un descuento es atómico: o se descuentan todos los ítems o ninguno (`SELECT ... FOR UPDATE`).
    - Los montos se envían como texto (`"30.00"`) o número (`30`); se responden siempre como texto con 2 decimales.
    - Textos de catálogo (categoría, talla, versión, parche, dorsal) se guardan en mayúsculas; `2XL` → `XXL`.

    Changelog 1.1.0 (aditivo): filtros `temporada`, `busqueda`, `solo_disponibles`, `sin_costo`; KPIs en
    `GET /variantes`; `PATCH /variantes/{id}/precios`; `costo_unitario` en movimientos; `GET /salud`.
servers:
  - url: http://localhost:3011/api/v1
    description: Local directo
  - url: http://localhost:3010/api/v1
    description: Local vía gateway
tags:
  - name: productos
  - name: variantes
  - name: stock
  - name: salud
paths:
  /productos:
    get:
      tags: [productos]
      summary: Listar productos con filtros
      operationId: listarProductos
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: categoria, in: query, schema: { $ref: '#/components/schemas/Categoria' } }
        - { name: marca_equipo, in: query, schema: { type: string }, description: Coincidencia parcial sin distinguir mayúsculas }
        - { name: temporada, in: query, schema: { type: string, example: '2024-25' }, description: Temporada exacta }
        - { name: busqueda, in: query, schema: { type: string }, description: Texto libre en nombre o marca/equipo }
        - { name: activo, in: query, schema: { type: boolean, default: true } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de productos
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PaginaProductos' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
    post:
      tags: [productos]
      summary: Crear producto
      operationId: crearProducto
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearProducto' }
      responses:
        '201':
          description: Producto creado
          headers:
            Location: { schema: { type: string }, description: '/api/v1/productos/{id}' }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Producto' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '409':
          description: 'Ya existe un producto con la misma categoría, nombre, marca y temporada (`PRODUCTO_DUPLICADO`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /productos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [productos]
      summary: Obtener producto con sus variantes
      operationId: obtenerProducto
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Producto'
                          - type: object
                            properties:
                              variantes:
                                type: array
                                items: { $ref: '#/components/schemas/Variante' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [productos]
      summary: Actualizar parcialmente un producto
      operationId: actualizarProducto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActualizarProducto' }
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Producto' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /variantes:
    get:
      tags: [variantes]
      summary: Buscar variantes (filtros rápidos de inventario + KPIs)
      description: |
        Orden: marca, nombre, temporada y talla natural (XS, S, M, L, XL, XXL).
        `kpis` se calcula sobre todo el conjunto filtrado, no solo sobre la página.
      operationId: listarVariantes
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: producto_id, in: query, schema: { type: string, format: uuid } }
        - { name: categoria, in: query, schema: { $ref: '#/components/schemas/Categoria' } }
        - { name: marca_equipo, in: query, schema: { type: string }, description: Coincidencia parcial }
        - { name: temporada, in: query, schema: { type: string, example: '2024-25' }, description: Temporada exacta }
        - { name: talla_medida, in: query, schema: { type: string, example: M }, description: 'Exacta; `2XL` se interpreta como `XXL`' }
        - { name: version_modelo, in: query, schema: { type: string, example: JUGADOR } }
        - { name: adicional_parche, in: query, schema: { type: string }, description: Coincidencia parcial }
        - { name: adicional_dorsal, in: query, schema: { type: string }, description: Coincidencia parcial }
        - { name: codigo_legacy, in: query, schema: { type: string, example: LTOO2 } }
        - { name: busqueda, in: query, schema: { type: string, example: yamal }, description: 'Texto libre en nombre, marca, temporada, código, parche, dorsal u observaciones' }
        - { name: solo_disponibles, in: query, schema: { type: boolean }, description: '`true` devuelve solo variantes con `stock_actual > 0`' }
        - { name: sin_costo, in: query, schema: { type: boolean }, description: '`true` devuelve solo variantes con `valor_jersey_club = 0` (costo pendiente)' }
        - { name: activo, in: query, schema: { type: boolean, default: true } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de variantes con KPIs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PaginaVariantes' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
    post:
      tags: [variantes]
      summary: Crear variante (nace con stock 0; el stock entra por `/stock/ajustes`)
      operationId: crearVariante
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearVariante' }
      responses:
        '201':
          description: Variante creada
          headers:
            Location: { schema: { type: string }, description: '/api/v1/variantes/{id}' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Variante' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: 'Ya existe la combinación producto + talla + versión + parche + dorsal (`VARIANTE_DUPLICADA`) o el `codigo_legacy` (`CODIGO_LEGACY_DUPLICADO`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /variantes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [variantes]
      summary: Obtener variante (incluye producto)
      operationId: obtenerVariante
      responses:
        '200':
          description: Variante encontrada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/VarianteConProducto' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [variantes]
      summary: Actualizar atributos de la variante (nunca `stock_actual` ni precios)
      operationId: actualizarVariante
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActualizarVariante' }
      responses:
        '200':
          description: Variante actualizada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Variante' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /variantes/{id}/precios:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/CorrelationId'
    patch:
      tags: [variantes]
      summary: Actualizar costo JRS (`valor_jersey_club`) y/o PVP sugerido
      description: |
        Endpoint ágil para cargar costos pendientes. Al menos uno de los dos campos es obligatorio.
        Si el PVP queda por debajo del costo, la operación se acepta y `message` incluye una advertencia.
        Las ventas ya registradas no cambian: su costo quedó congelado en `detalle_ventas`.
      operationId: actualizarPreciosVariante
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActualizarPrecios' }
            example: { valor_jersey_club: '27.50', pvp_sugerido: '45.00' }
      responses:
        '200':
          description: Precios actualizados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/VarianteConProducto' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /salud:
    get:
      tags: [salud]
      summary: Estado del servicio y del esquema conectado
      operationId: salud
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          servicio: { type: string, example: ms-inventario }
                          esquema: { type: string, example: ms_inventario }
                          base_datos: { type: string, example: OK }
        '503': { $ref: '#/components/responses/NoDisponible' }

  /stock/descuentos:
    post:
      tags: [stock]
      summary: Descontar stock de forma atómica (usado por ms-ventas)
      description: |
        En una sola transacción: bloquea cada variante (`SELECT ... FOR UPDATE`), verifica
        `stock_actual >= cantidad`, descuenta y registra un movimiento `VENTA` por ítem (con el
        `costo_unitario` vigente). Si cualquier ítem no tiene stock, hace ROLLBACK y responde `409`
        detallando cada variante que falló. Una variante repetida en `items` se descuenta por la suma.
        Cada movimiento se guarda con `idempotency_key = "<Idempotency-Key>:<variante_id>"`.
        La respuesta incluye el snapshot de cada variante para que ms-ventas lo congele; en una
        repetición idempotente `valor_jersey_club` es el costo congelado en el movimiento original.

        Códigos 409: `STOCK_INSUFICIENTE`, `VARIANTE_INACTIVA`, `IDEMPOTENCY_KEY_CONFLICTO`,
        `REFERENCIA_YA_DESCONTADA` (la referencia ya tiene un descuento con otra clave).
      operationId: crearDescuento
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudDescuento' }
      responses:
        '201':
          description: Stock descontado
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ResultadoDescuento' }
        '200':
          description: Repetición idempotente; devuelve el resultado original sin mover stock
          headers:
            Idempotent-Replayed: { schema: { type: boolean, example: true } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ResultadoDescuento' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/StockInsuficiente' }
        '503': { $ref: '#/components/responses/NoDisponible' }
  /stock/reversiones:
    post:
      tags: [stock]
      summary: Revertir el descuento de una venta (compensación de la saga)
      description: |
        Devuelve al stock lo descontado para `referencia_id` y registra un movimiento
        `REVERSION_VENTA` por ítem (al mismo costo del descuento). Es idempotente por referencia:
        si ya estaba revertido (con cualquier clave) responde `200` sin mover stock, también ante
        reversiones concurrentes.
      operationId: crearReversion
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudReversion' }
      responses:
        '201':
          description: Stock revertido
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ResultadoMovimientos' }
        '200':
          description: Ya estaba revertido (idempotente)
          headers:
            Idempotent-Replayed: { schema: { type: boolean, example: true } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ResultadoMovimientos' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '404':
          description: 'No existe un descuento para esa `referencia_id` (`DESCUENTO_NO_ENCONTRADO`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/NoDisponible' }
  /stock/ajustes:
    post:
      tags: [stock]
      summary: Entrada de mercadería o ajuste manual de inventario
      description: '`AJUSTE_SALIDA` mayor al stock disponible → `409 STOCK_INSUFICIENTE`. El motivo queda en el Kardex.'
      operationId: crearAjuste
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudAjuste' }
      responses:
        '201':
          description: Ajuste registrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MovimientoStock' }
        '200':
          description: Repetición idempotente
          headers:
            Idempotent-Replayed: { schema: { type: boolean, example: true } }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/StockInsuficiente' }
  /stock/movimientos:
    get:
      tags: [stock]
      summary: Consultar el Kardex
      operationId: listarMovimientos
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: variante_id, in: query, schema: { type: string, format: uuid } }
        - { name: referencia_id, in: query, schema: { type: string, format: uuid } }
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoMovimiento' } }
        - { name: desde, in: query, schema: { type: string, format: date-time } }
        - { name: hasta, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de movimientos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/MovimientoStock' }
                          meta: { $ref: '#/components/schemas/MetaPaginacion' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }

components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de trazabilidad. Si no llega, el servicio genera uno.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Clave única de la operación (ms-ventas usa el id de la venta). Alternativa: `idempotency_key` en el cuerpo.'
      schema: { type: string, minLength: 8, maxLength: 48, pattern: '^[\w\-:.]+$' }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  headers:
    CorrelationId:
      schema: { type: string, format: uuid }
  responses:
    ErrorValidacion:
      description: Datos inválidos (`VALIDACION_FALLIDA`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            status: 400
            error: Bad Request
            details: ['cantidad must be a positive number']
            error_code: VALIDACION_FALLIDA
            correlation_id: 7b0d2c1e-4f7a-4d3e-9b1a-2f6c8e9d0a11
    NoEncontrado:
      description: Recurso inexistente (`PRODUCTO_NO_ENCONTRADO` / `VARIANTE_NO_ENCONTRADA`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflicto:
      description: Conflicto de unicidad
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StockInsuficiente:
      description: Stock insuficiente en al menos una variante; no se movió stock
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            status: 409
            error: Conflict
            details: ['Variante 3f2c9a1e-... (LTOO2): solicitado 2, disponible 1']
            error_code: STOCK_INSUFICIENTE
            correlation_id: 7b0d2c1e-4f7a-4d3e-9b1a-2f6c8e9d0a11
    NoDisponible:
      description: Base de datos o dependencia no disponible (`SERVICIO_NO_DISPONIBLE`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    RespuestaBase:
      type: object
      required: [status, message, data]
      properties:
        status: { type: integer, example: 200 }
        message: { type: string, example: Operación exitosa }
        data: {}
    Error:
      type: object
      required: [status, error, details, error_code, correlation_id]
      properties:
        status: { type: integer, example: 409 }
        error: { type: string, example: Conflict }
        details:
          type: array
          items: { type: string }
        error_code: { type: string, example: STOCK_INSUFICIENTE }
        correlation_id: { type: string, format: uuid }
    MetaPaginacion:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    Categoria:
      type: string
      description: Lista abierta; estas son las categorías iniciales.
      example: CAMISETA
      enum: [CAMISETA, CHOMPA, CANILLERAS, GORRA, ACCESORIO]
    TipoMovimiento:
      type: string
      enum: [SALDO_INICIAL, VENTA, REVERSION_VENTA, AJUSTE_ENTRADA, AJUSTE_SALIDA]
    Dinero:
      type: string
      pattern: '^-?\d{1,8}\.\d{2}$'
      description: Decimal con 2 cifras serializado como texto para no perder precisión.
      example: '30.00'
    Producto:
      type: object
      properties:
        id: { type: string, format: uuid }
        categoria: { $ref: '#/components/schemas/Categoria' }
        nombre: { type: string, example: Argentina LOCAL }
        marca_equipo: { type: string, example: Argentina }
        temporada_coleccion: { type: string, nullable: true, example: '2024' }
        activo: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CrearProducto:
      type: object
      additionalProperties: false
      required: [categoria, nombre, marca_equipo]
      properties:
        categoria: { $ref: '#/components/schemas/Categoria' }
        nombre: { type: string, maxLength: 150 }
        marca_equipo: { type: string, maxLength: 100 }
        temporada_coleccion: { type: string, maxLength: 20, pattern: '^\d{4}(-\d{2})?$', example: '2024-25' }
    ActualizarProducto:
      type: object
      additionalProperties: false
      properties:
        categoria: { $ref: '#/components/schemas/Categoria' }
        nombre: { type: string, maxLength: 150 }
        marca_equipo: { type: string, maxLength: 100 }
        temporada_coleccion: { type: string, maxLength: 20, nullable: true }
        activo: { type: boolean }
    Variante:
      type: object
      properties:
        id: { type: string, format: uuid }
        producto_id: { type: string, format: uuid }
        codigo_legacy: { type: string, nullable: true, example: LTOO2 }
        talla_medida: { type: string, example: L }
        version_modelo: { type: string, example: JUGADOR }
        adicional_parche: { type: string, nullable: true, example: EUROCOPA Y UEFA FOUNDATION }
        adicional_dorsal: { type: string, nullable: true, example: KRROS 8 }
        observaciones: { type: string, nullable: true }
        stock_actual: { type: integer, minimum: 0 }
        valor_jersey_club: { $ref: '#/components/schemas/Dinero' }
        pvp_sugerido: { $ref: '#/components/schemas/Dinero' }
        activo: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    VarianteConProducto:
      allOf:
        - $ref: '#/components/schemas/Variante'
        - type: object
          properties:
            producto: { $ref: '#/components/schemas/Producto' }
    CrearVariante:
      type: object
      additionalProperties: false
      required: [producto_id, talla_medida, version_modelo]
      properties:
        producto_id: { type: string, format: uuid }
        codigo_legacy: { type: string, maxLength: 30 }
        talla_medida: { type: string, maxLength: 20 }
        version_modelo: { type: string, maxLength: 30 }
        adicional_parche: { type: string, maxLength: 150 }
        adicional_dorsal: { type: string, maxLength: 100 }
        observaciones: { type: string }
        valor_jersey_club: { $ref: '#/components/schemas/Dinero' }
        pvp_sugerido: { $ref: '#/components/schemas/Dinero' }
    ActualizarVariante:
      type: object
      additionalProperties: false
      description: '`stock_actual` no es editable (solo por movimientos); los precios van por `PATCH /variantes/{id}/precios`.'
      properties:
        codigo_legacy: { type: string, maxLength: 30 }
        talla_medida: { type: string, maxLength: 20 }
        version_modelo: { type: string, maxLength: 30 }
        adicional_parche: { type: string, maxLength: 150, nullable: true }
        adicional_dorsal: { type: string, maxLength: 100, nullable: true }
        observaciones: { type: string, nullable: true }
        activo: { type: boolean }
    ActualizarPrecios:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        valor_jersey_club: { $ref: '#/components/schemas/Dinero' }
        pvp_sugerido: { $ref: '#/components/schemas/Dinero' }
    KpisInventario:
      type: object
      properties:
        total_skus: { type: integer, example: 95 }
        skus_con_stock: { type: integer, example: 71 }
        unidades_stock: { type: integer, example: 153 }
        valorizacion_costo_jrs: { $ref: '#/components/schemas/Dinero' }
        valorizacion_pvp: { $ref: '#/components/schemas/Dinero' }
        skus_sin_costo: { type: integer, example: 80 }
    PaginaProductos:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Producto' }
        meta: { $ref: '#/components/schemas/MetaPaginacion' }
    PaginaVariantes:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/VarianteConProducto' }
        meta: { $ref: '#/components/schemas/MetaPaginacion' }
        kpis: { $ref: '#/components/schemas/KpisInventario' }
    SolicitudDescuento:
      type: object
      additionalProperties: false
      required: [referencia_id, items]
      properties:
        idempotency_key: { type: string, minLength: 8, maxLength: 48, description: Alternativa a la cabecera Idempotency-Key }
        referencia_id: { type: string, format: uuid, description: Id de la venta en ms-ventas }
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [variante_id, cantidad]
            properties:
              variante_id: { type: string, format: uuid }
              cantidad: { type: integer, minimum: 1 }
    SnapshotVariante:
      type: object
      description: Datos congelados que ms-ventas guarda en `detalle_ventas.snapshot_producto`.
      properties:
        variante_id: { type: string, format: uuid }
        producto_id: { type: string, format: uuid }
        codigo_legacy: { type: string, nullable: true }
        categoria: { type: string }
        nombre: { type: string }
        marca_equipo: { type: string }
        temporada_coleccion: { type: string, nullable: true }
        talla_medida: { type: string }
        version_modelo: { type: string }
        adicional_parche: { type: string, nullable: true }
        adicional_dorsal: { type: string, nullable: true }
        valor_jersey_club: { $ref: '#/components/schemas/Dinero' }
        pvp_sugerido: { $ref: '#/components/schemas/Dinero' }
    MovimientoStock:
      type: object
      properties:
        id: { type: string, format: uuid }
        variante_id: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoMovimiento' }
        cantidad: { type: integer, description: Siempre positiva; el tipo indica el sentido }
        stock_anterior: { type: integer }
        stock_nuevo: { type: integer }
        costo_unitario:
          allOf: [{ $ref: '#/components/schemas/Dinero' }]
          nullable: true
          description: Costo JRS unitario vigente al registrar el movimiento (Kardex valorizado)
        idempotency_key: { type: string, nullable: true }
        referencia_id: { type: string, format: uuid, nullable: true }
        observacion: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    ResultadoDescuento:
      type: object
      properties:
        referencia_id: { type: string, format: uuid }
        items:
          type: array
          items:
            type: object
            properties:
              movimiento: { $ref: '#/components/schemas/MovimientoStock' }
              snapshot: { $ref: '#/components/schemas/SnapshotVariante' }
    SolicitudReversion:
      type: object
      additionalProperties: false
      required: [referencia_id]
      properties:
        idempotency_key: { type: string, minLength: 8, maxLength: 48, description: Alternativa a la cabecera Idempotency-Key }
        referencia_id: { type: string, format: uuid }
        motivo: { type: string, maxLength: 300 }
    ResultadoMovimientos:
      type: object
      properties:
        referencia_id: { type: string, format: uuid }
        movimientos:
          type: array
          items: { $ref: '#/components/schemas/MovimientoStock' }
    SolicitudAjuste:
      type: object
      additionalProperties: false
      required: [variante_id, tipo, cantidad, observacion]
      properties:
        idempotency_key: { type: string, minLength: 8, maxLength: 48, description: Alternativa a la cabecera Idempotency-Key }
        variante_id: { type: string, format: uuid }
        tipo:
          type: string
          enum: [AJUSTE_ENTRADA, AJUSTE_SALIDA]
        cantidad: { type: integer, minimum: 1 }
        observacion: { type: string, maxLength: 300 }
